<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#131823"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dangerG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#20283a" stroke-width="2"/>

  <!-- Top Badges -->
  <g transform="translate(60, 60)">
    <rect width="210" height="36" rx="18" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
    <text x="105" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">🔥 BRASILEIRÃO 2026</text>
    
    <rect x="225" width="220" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="335" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">PÓS-34ª RODADA (05/11)</text>

    <rect x="460" width="230" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="575" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">20.000x MONTE CARLO</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#f1f5f9" letter-spacing="-1px">
    Simulador de Rebaixamento
  </text>
  <text x="60" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#38bdf8">
    Probabilidades do Z4 e Calculadora de Reta Final
  </text>
  <text x="60" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">
    Modelo Estocástico de Gols (Poisson) · Parâmetros UFMG / CNN Brasil · 43 Jogos Restantes
  </text>

  <!-- Cards Graphic (Z4 Teams) -->
  <g transform="translate(60, 310)">
    <!-- Card 1: Grêmio -->
    <rect x="0" y="0" width="250" height="180" rx="12" fill="#171e2e" stroke="#dc2626" stroke-width="2"/>
    <text x="20" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Grêmio</text>
    <text x="230" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">37 pts</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ef4444">60.4%</text>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Risco de Z4 (UFMG)</text>
    <rect x="20" y="145" width="210" height="8" rx="4" fill="#0b0e14"/>
    <rect x="20" y="145" width="126" height="8" rx="4" fill="#ef4444"/>

    <!-- Card 2: Corinthians -->
    <rect x="270" y="0" width="250" height="180" rx="12" fill="#171e2e" stroke="#dc2626" stroke-width="2"/>
    <text x="290" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Corinthians</text>
    <text x="500" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">37 pts</text>
    <text x="290" y="100" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ef4444">55.0%</text>
    <text x="290" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Risco de Z4 (UFMG)</text>
    <rect x="290" y="145" width="210" height="8" rx="4" fill="#0b0e14"/>
    <rect x="290" y="145" width="115" height="8" rx="4" fill="#ef4444"/>

    <!-- Card 3: Internacional -->
    <rect x="540" y="0" width="250" height="180" rx="12" fill="#171e2e" stroke="#f59e0b" stroke-width="2"/>
    <text x="560" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Internacional</text>
    <text x="770" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">38 pts</text>
    <text x="560" y="100" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#f59e0b">40.8%</text>
    <text x="560" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Risco de Z4 (UFMG)</text>
    <rect x="560" y="145" width="210" height="8" rx="4" fill="#0b0e14"/>
    <rect x="560" y="145" width="85" height="8" rx="4" fill="#f59e0b"/>

    <!-- Card 4: Chapecoense (Rebaixada) -->
    <rect x="810" y="0" width="270" height="180" rx="12" fill="#171e2e" stroke="#64748b" stroke-width="1"/>
    <text x="830" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Chapecoense</text>
    <text x="1060" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">21 pts</text>
    <text x="830" y="100" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#dc2626">100%</text>
    <text x="830" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ef4444">QUEDA MATEMÁTICA</text>
    <rect x="830" y="145" width="230" height="8" rx="4" fill="#dc2626"/>
  </g>

  <!-- Footer Link -->
  <text x="60" y="550" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">
    🔗 marceloasl99.github.io/brasileirao-rebaixamento-2026
  </text>
  <text x="1140" y="550" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="end">
    Livre e Aberto · Modelo Monte Carlo
  </text>
</svg>
